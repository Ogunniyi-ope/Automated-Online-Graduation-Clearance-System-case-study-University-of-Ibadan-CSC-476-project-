{% extends 'base.html' %}{% block title %}Change password{% endblock %}
{% block body %}<div class="card narrow"><h2>Change password</h2>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<label for="old">Current password</label><input id="old" type="password" name="old" required>
<label for="new">New password (8+ characters, upper and lower case, a digit)</label><input id="new" type="password" name="new" required>
<button class="btn" type="submit">Save</button></form></div>{% endblock %}
